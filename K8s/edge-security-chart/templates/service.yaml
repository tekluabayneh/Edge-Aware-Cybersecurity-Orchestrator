---
apiVersion: v1
kind: Service
metadata:
  name: edge-frontend-service
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.frontend.label }}
  ports:
    - protocol: TCP
      port: 80
      targetPort: {{ .Values.frontend.port }}

---
apiVersion: v1
kind: Service
metadata:
  name: edge-backend-service
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.backend.label }}
  ports:
    - protocol: TCP
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
