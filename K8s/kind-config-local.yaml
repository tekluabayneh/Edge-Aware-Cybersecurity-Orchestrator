kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
            cluster-dns: "8.8.8.8"
      - |
        kind: ClusterConfiguration
        networking:
          dnsDomain: cluster.local
        dnsPolicy: None
        DNS:
          - 8.8.8.8
          - 8.8.4.4
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
    extraMounts:
      - hostPath: /home/teklu/Desktop/Edge-Aware-Cybersecurity-Orchestrator/K8s/kind-bind-mount-1
        containerPath: /some/path/in/container
  - role: worker
    extraMounts:
      - hostPath: /home/teklu/Desktop/Edge-Aware-Cybersecurity-Orchestrator/K8s/kind-bind-mount-2
        containerPath: /some/path/in/container
