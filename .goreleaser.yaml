version: 2

project_name: agent

builds:
  - id: agent
    main: ./cmd/app/app.go
    binary: agent

    goos:
      - linux
      - darwin
      - windows

    goarch:
      - amd64
      - arm64

    env:
      - CGO_ENABLED=0

archives:
  - id: agent
    builds:
      - agent

    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

    format_overrides:
      - goos: windows
        format: zip

release:
  github:
    owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
    name: "{{ .ProjectName }}"
