version: 2

project_name: agent

gomod:
  dir: ./agent

builds:
  - id: agent
    dir: ./agent
    main: ./main.go
    binary: agent
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    hooks:
      post:
        - cmd: >
            {{- if and (eq .Os "windows") (eq .Runtime.Goos "windows") -}}
            iscc.exe /DAppVersion={{.Version}} /DSourcePath={{ dir .Path }} /DArch={{.Arch}} "{{ dir (dir (dir .Path)) }}/installer.iss"
            {{- end -}}

nfpms:
  - id: agent-linux
    package_name: agent
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    scripts:
      postinstall: scripts/postinstall.sh

archives:
  - id: default
    builds:
      - agent
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE*
      - README*

  # Custom entry to include the Inno Setup .exe files as separate assets
  - id: windows-installer
    name_template: "Agent_Setup_{{ .Arch }}"
    format: binary  # dummy format since we're just including files
    files:
      - src: "Output_{{ .Arch }}/*.exe"   # primary: if OutputDir=Output_{#Arch} in .iss
        dst: .

release:
  github:
    owner: tekluabayneh
    name: Edge-Aware-Cybersecurity-Orchestrator
