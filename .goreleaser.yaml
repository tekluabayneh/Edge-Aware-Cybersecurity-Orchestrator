version: 2

project_name: agent

gomod:
  dir: ./agent

builds:
  - id: agent
    dir: ./agent
    main: ./main.go
    binary: agent
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    hooks:
      post:
        - cmd: >
            {{- if and (eq .Os "windows") (eq .Runtime.Goos "windows") -}}
            iscc.exe /DAppVersion={{.Version}} /DSourcePath={{ dir .Path }} /DArch={{.Arch}} "{{ dir (dir (dir .Path)) }}/installer.iss"
            {{- end -}}

nfpms:
  - id: agent-linux
    package_name: agent
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    scripts:
      postinstall: scripts/postinstall.sh

archives:
  - id: default
    builds:
      - agent
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    # Optional: add any extra root files to all archives
    files:
      - LICENSE*
      - README*

  # Custom archive for Windows installers only (this will produce Agent_Setup_amd64.exe etc.)
  - id: windows-installer
    name_template: "Agent_Setup_{{ .Arch }}"
    format: binary  # dummy; we override with files
    files:
      - src: "Output_{{ .Arch }}/*.exe"   # if you have OutputDir=Output_{#Arch} in .iss
        dst: .
      - src: "Output/*.exe"               # fallback if no per-arch dir
        dst: .
      - src: "*.exe"                      # fallback if OutputDir=. (root)
        dst: .
    goos:
      - windows
    builds:
      - agent

# Optional fallback: copy installers to dist/ so they get auto-uploaded
before_publish:
  - cmd: >
      {{- if eq .Os "windows" -}}
      if exist "Output_{{ .Arch }}\*.exe" copy "Output_{{ .Arch }}\*.exe" dist\
      {{- end -}}

release:
  github:
    owner: tekluabayneh
    name: Edge-Aware-Cybersecurity-Orchestrator
