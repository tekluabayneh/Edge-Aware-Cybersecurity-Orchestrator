version: 2

project_name: agent

gomod:
  dir: ./agent

builds:
  - id: agent
    dir: ./agent/
    main: ./main.go
    binary: agent
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    # --- FIXED WINDOWS HOOK ---
    hooks:
      post:
        # In v2, we use the 'if' property with Go template boolean logic
        - cmd: iscc.exe /DAppVersion={{.Version}} /DSourcePath={{.Path}} /DArch={{.Arch}} ../installer.iss
          if: '{{ eq .Os "windows" }}'

# --- NEW LINUX STAFF (.deb / .rpm) ---
nfpms:
  - id: agent-linux
    package_name: agent
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    contents:
      - src: ./agent
        dst: /usr/bin/agent
    scripts:
      # Use ../ because your build 'dir' is ./agent, but scripts is in the root
      postinstall: ../scripts/postinstall.sh

archives:
  - id: agent
    builds:
      - agent
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

release:
  github:
    owner: tekluabayneh
    name: Edge-Aware-Cybersecurity-Orchestrator
