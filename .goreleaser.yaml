version: 2

project_name: agent

gomod:
  dir: ./agent

builds:
  - id: agent
    dir: ./agent/
    main: ./main.go
    binary: agent
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    # --- FIXED WINDOWS HOOK FOR V2 ---
    hooks:
      post:
        - cmd: >
            {{- if and (eq .Os "windows") (eq .Runtime.Goos "windows") -}}
            iscc.exe /DAppVersion={{.Version}} /DSourcePath={{.Path}} /DArch={{.Arch}} "{{ .ProjectDir }}/installer.iss"
            {{- end -}}

# --- NEW LINUX STAFF (.deb / .rpm) ---
nfpms:
  - id: agent-linux
    package_name: agent
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    contents:
      - src: agent
        dst: /usr/bin/agent
    scripts:
      # Using .ProjectDir ensures it finds the script from the root
      postinstall: "{{ .ProjectDir }}/scripts/postinstall.sh"

archives:
  - id: agent
    builds:
      - agent
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

release:
  github:
    owner: tekluabayneh
    name: Edge-Aware-Cybersecurity-Orchestrator

