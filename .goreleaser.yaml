version: 2

project_name: agent

gomod:
  dir: ./agent

builds:
  - id: agent
    dir: ./agent/
    main: ./main.go
    binary: agent
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    # --- NEW WINDOWS STAFF ---
    hooks:
      post:
        # This calls Inno Setup only when building for Windows
        - cmd: iscc.exe /DAppVersion={{.Version}} /DSourcePath={{.Path}} /DArch={{.Arch}} ../installer.iss
          if: '"{{.Os}}" == "windows"'

# --- NEW LINUX STAFF (.deb / .rpm) ---
nfpms:
  - id: agent-linux
    package_name: agent
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    contents:
      - src: ./agent
        dst: /usr/bin/agent
    scripts:
      postinstall: ./scripts/postinstall.sh

archives:
  - id: agent
    builds:
      - agent
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

release:
  github:
    owner: tekluabayneh
    name: Edge-Aware-Cybersecurity-Orchestrator
