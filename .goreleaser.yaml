version: 2

project_name: agent

gomod:
  dir: ./agent

builds:
  - id: agent
    dir: ./agent/
    main: ./main.go
    binary: agent
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    # --- FIXED WINDOWS HOOK FOR V2 ---
    hooks:
      post:
        - cmd: >
            {{ if eq .Os "windows" }}
            iscc.exe /DAppVersion={{.Version}} /DSourcePath={{.Path}} /DArch={{.Arch}} ../installer.iss
            {{ end }}

# --- NEW LINUX STAFF (.deb / .rpm) ---
nfpms:
  - id: agent-linux
    package_name: agent
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    contents:
      - src: ./agent
        dst: /usr/bin/agent
    scripts:
      # Since 'dir' is ./agent, we must go up to find the scripts folder
      postinstall: ../scripts/postinstall.sh

archives:
  - id: agent
    builds:
      - agent
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

release:
  github:
    owner: tekluabayneh
    name: Edge-Aware-Cybersecurity-Orchestrator

