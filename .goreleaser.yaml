version: 2

project_name: agent

# REMOVED before hooks to fix "go.mod file not found" error
# The build process handles dependencies within the ./agent dir

builds:
  - id: agent
    dir: ./agent
    main: ./main.go
    binary: agent
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    hooks:
      post:
        - cmd: >
            {{- if eq .Os "windows" }}
            echo "Building Windows Installer for {{ .Arch }}..." &&
            iscc.exe /DAppVersion={{ .Version }} /DArch={{ .Arch }} "{{ .Dist }}/installer.iss" &&
            timeout /t 5 /nobreak >nul &&
            copy "Output_{{ .Arch }}\*.exe" "{{ .Dist }}\agent_installer_{{ .Version }}_{{ .Arch }}.exe"
            {{- end }}

nfpms:
  - id: agent-linux
    package_name: agent
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    scripts:
      postinstall: scripts/postinstall.sh

archives:
  - id: default
    builds:
      - agent
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE*
      - README*

release:
  github:
    owner: tekluabayneh
    name: Edge-Aware-Cybersecurity-Orchestrator
  # Explicitly upload unique installer files to prevent 422 collisions
  extra_files:
    - glob: ./dist/agent_installer_*.exe

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - Merge pull request
      - Merge branch

dist: ./dist
