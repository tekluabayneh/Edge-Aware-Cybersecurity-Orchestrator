version: 2

project_name: agent

builds:
  - id: agent
    dir: ./agent
    main: ./main.go
    binary: agent
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    hooks:
      post:
        - cmd: >
            {{- if eq .Os "windows" }}
            powershell -Command "$bin='{{ .Path }}'; $root=Split-Path (Split-Path (Split-Path $bin)); Write-Host \"[DEBUG] ProjectRoot: $root\"; Write-Host \"[DEBUG] Binary: $bin\"; Copy-Item $bin \"$root\agent.exe\" -Force; Write-Host \"[DEBUG] Running ISCC\"; & \"$env:ProgramFiles\Inno Setup 6\ISCC.exe\" \"/DAppVersion={{ .Version }}\" \"/DArch={{ .Arch }}\" \"$root\installer.iss\"; if ($LASTEXITCODE -ne 0) { Write-Error \"ISCC failed\"; exit 1 }; $src=\"$root\Output_{{ .Arch }}\Agent_Setup_{{ .Arch }}.exe\"; Write-Host \"[DEBUG] Checking: $src\"; if (!(Test-Path $src)) { Write-Error \"ISCC output missing: $src\"; exit 1 }; $dist=\"$root\dist\"; if (!(Test-Path $dist)) { New-Item -ItemType Directory -Force -Path $dist | Out-Null }; $dest=\"$dist\agent_installer_{{ .Version }}_{{ .Arch }}.exe\"; Write-Host \"[DEBUG] Copying to: $dest\"; Copy-Item $src $dest -Force; if (!(Test-Path $dest)) { Write-Error \"Installer not in dist: $dest\"; exit 1 }; Write-Host \"[DEBUG] Installer ready: $dest\"; Remove-Item \"$root\agent.exe\" -Force; Write-Host \"[DEBUG] Cleanup done\""
            {{- end }}

nfpms:
  - id: agent-linux
    package_name: agent
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    scripts:
      postinstall: scripts/postinstall.sh

archives:
  - id: default
    builds:
      - agent
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE*
      - README*

release:
  github:
    owner: tekluabayneh
    name: Edge-Aware-Cybersecurity-Orchestrator
  extra_files:
    - glob: "./dist/agent_installer_*.exe"
    - glob: "dist/agent_installer_*.exe"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - Merge pull request
      - Merge branch

dist: ./dist
