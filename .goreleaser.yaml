version: 2

project_name: agent

builds:
  - id: agent
    dir: ./agent
    main: ./main.go
    binary: agent
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    hooks:
      post:
        - cmd: >
            {{- if eq .Os "windows" }}
            powershell -Command "Write-Host '=== INSTALLER BUILD START [{{ .Arch }}] ==='" &&
            powershell -Command "Write-Host 'Binary: {{ .Path }}'" &&
            powershell -Command "Copy-Item -Path '{{ .Path }}' -Destination '.\\agent.exe' -Force" &&
            powershell -Command "Write-Host 'Running ISCC...'" &&
            powershell -Command "& 'iscc.exe' '/DAppVersion={{ .Version }}' '/DArch={{ .Arch }}' '..\\installer.iss'" &&
            powershell -Command "Write-Host 'Checking output...'" &&
            powershell -Command "if (Test-Path '.\\Output_{{ .Arch }}\\Agent_Setup_{{ .Arch }}.exe') { Write-Host 'Output found' } else { Write-Host 'OUTPUT NOT FOUND'; exit 1 }" &&
            powershell -Command "Write-Host 'Copying to Dist: {{ .Dist }}'" &&
            powershell -Command "Copy-Item -Path '.\\Output_{{ .Arch }}\\Agent_Setup_{{ .Arch }}.exe' -Destination '{{ .Dist }}\\agent_installer_{{ .Version }}_{{ .Arch }}.exe' -Force" &&
            powershell -Command "Write-Host 'Verifying dist...'" &&
            powershell -Command "if (Test-Path '{{ .Dist }}\\agent_installer_{{ .Version }}_{{ .Arch }}.exe') { Write-Host 'Installer in dist: OK' } else { Write-Host 'INSTALLER NOT IN DIST'; exit 1 }" &&
            powershell -Command "Remove-Item -Path '.\\agent.exe' -Force" &&
            powershell -Command "Write-Host '=== INSTALLER BUILD COMPLETE [{{ .Arch }}] ==='"
            {{- end }}

nfpms:
  - id: agent-linux
    package_name: agent
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    scripts:
      postinstall: scripts/postinstall.sh

archives:
  - id: default
    builds:
      - agent
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE*
      - README*

release:
  github:
    owner: tekluabayneh
    name: Edge-Aware-Cybersecurity-Orchestrator
  extra_files:
    - glob: "dist/agent_installer_*.exe"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - Merge pull request
      - Merge branch

dist: ./dist
