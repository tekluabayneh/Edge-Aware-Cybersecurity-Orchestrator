version: 2

project_name: agent

builds:
  - id: agent
    dir: ./agent
    main: ./main.go
    binary: agent
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    hooks:
      post:
        - cmd: >
            {{- if eq .Os "windows" }}
            echo "=== START INSTALLER BUILD FOR {{ .Arch }} ===" &&
            echo "Binary path: {{ .Path }}" &&
            echo "Project root: {{ dir (dir (dir .Path)) }}" &&
            echo "Dist folder: {{ dir (dir .Path) }}" &&
            copy "{{ .Path }}" "{{ dir (dir (dir .Path)) }}\agent.exe" &&
            echo "Running ISCC..." &&
            iscc.exe /DAppVersion={{ .Version }} /DArch={{ .Arch }} "{{ dir (dir (dir .Path)) }}/installer.iss" &&
            echo "ISCC finished, checking output..." &&
            dir "{{ dir (dir (dir .Path)) }}\Output_{{ .Arch }}\" &&
            copy "{{ dir (dir (dir .Path)) }}\Output_{{ .Arch }}\Agent_Setup_{{ .Arch }}.exe" "{{ dir (dir .Path ) }}\agent_installer_{{ .Version }}_{{ .Arch }}.exe" &&
            echo "Installer copied to dist, listing dist folder:" &&
            dir "{{ dir (dir .Path) }}\agent_installer_*" &&
            del "{{ dir (dir (dir .Path)) }}\agent.exe"
            {{- end }}

nfpms:
  - id: agent-linux
    package_name: agent
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    scripts:
      postinstall: scripts/postinstall.sh

archives:
  - id: default
    builds:
      - agent
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE*
      - README*

release:
  github:
    owner: tekluabayneh
    name: Edge-Aware-Cybersecurity-Orchestrator
  extra_files:
    - glob: "dist/agent_installer_*.exe"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - Merge pull request
      - Merge branch

dist: ./dist
