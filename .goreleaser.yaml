version: 2

project_name: agent

builds:
  - id: agent
    dir: ./agent
    main: ./main.go
    binary: agent
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    hooks:
      post:
        - cmd: >
            {{- if eq .Os "windows" }}
            powershell -ExecutionPolicy Bypass -File "../scripts/build_installer.ps1" 
            -Version "{{ .Version }}" 
            -Arch "{{ .Arch }}" 
            -Binary "{{ .Path }}" 
            -Dist "{{ .Dist }}"
            {{- end }}

nfpms:
  - id: agent-linux
    package_name: agent
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    scripts:
      postinstall: scripts/postinstall.sh

archives:
  - id: default
    builds:
      - agent
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE*
      - README*

release:
  github:
    owner: tekluabayneh
    name: Edge-Aware-Cybersecurity-Orchestrator
  extra_files:
    - glob: "dist/agent_installer_*.exe"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - Merge pull request
      - Merge branch

dist: ./dist
