version: 2

project_name: agent

builds:
  - id: agent
    dir: ./agent
    main: ./main.go
    binary: agent
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    hooks:
      post:
        - cmd: >
            {{- if eq .Os "windows" }}
            powershell -Command "Copy-Item '{{ .Path }}' '../agent.exe' -Force" &&
            powershell -Command "& 'iscc.exe' '/DAppVersion={{ .Version }}' '/DArch={{ .Arch }}' '../installer.iss'" &&
            powershell -Command "$o='../Output_{{ .Arch }}/Agent_Setup_{{ .Arch }}.exe'; if (!(Test-Path $o)) { exit 1 }" &&
            powershell -Command "New-Item -ItemType Directory -Force -Path '../dist' | Out-Null" &&
            powershell -Command "Copy-Item '../Output_{{ .Arch }}/Agent_Setup_{{ .Arch }}.exe' '../dist/agent_installer_{{ .Version }}_{{ .Arch }}.exe' -Force" &&
            powershell -Command "Remove-Item '../agent.exe' -Force"
            {{- end }}

nfpms:
  - id: agent-linux
    package_name: agent
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    scripts:
      postinstall: scripts/postinstall.sh

archives:
  - id: default
    builds:
      - agent
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE*
      - README*

release:
  github:
    owner: tekluabayneh
    name: Edge-Aware-Cybersecurity-Orchestrator
  extra_files:
    - glob: "dist/agent_installer_*.exe"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - Merge pull request
      - Merge branch

dist: ./dist
