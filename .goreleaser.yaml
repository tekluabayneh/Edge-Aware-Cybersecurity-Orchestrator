version: 2

project_name: agent

gomod:
  dir: ./agent

builds:
  - id: agent
    dir: ./agent
    main: ./main.go
    binary: agent
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    hooks:
      post:
        - cmd: >
            {{- if and (eq .Os "windows") (eq .Runtime.Goos "windows") -}}
            cmd /c copy "{{ .Path }}" "{{ dir (dir (dir .Path)) }}\agent.exe" >nul 2>&1 &&
            iscc.exe /DAppVersion={{.Version}} /DArch={{.Arch}} "{{ dir (dir (dir .Path)) }}\installer.iss"
            {{- end -}}

nfpms:
  - id: agent-linux
    package_name: agent
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    scripts:
      postinstall: scripts/postinstall.sh

archives:
  - id: default
    builds:
      - agent
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE*
      - README*

  - id: windows-installers
    name_template: "agent_setup_{{ .Version }}_{{ .Arch }}_{{ .ShortCommit }}.exe"
    format: binary
    files:
      - src: "Output_{{ .Arch }}/*.exe"
        dst: .

release:
  github:
    owner: tekluabayneh
    name: Edge-Aware-Cybersecurity-Orchestrator
