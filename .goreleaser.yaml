version: 2

project_name: agent

gomod:
  dir: ./agent

builds:
  - id: agent
    dir: ./agent
    main: ./main.go
    binary: agent
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    hooks:
      post:
        - cmd: >
            {{- if and (eq .Os "windows") (eq .Runtime.Goos "windows") -}}
            iscc.exe /DAppVersion={{.Version}} /DSourcePath={{ dir .Path }} /DArch={{.Arch}} "{{ dir (dir (dir .Path)) }}/installer.iss"
            {{- end -}}

nfpms:
  - id: agent-linux
    package_name: agent
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    scripts:
      postinstall: scripts/postinstall.sh

# ... your builds, hooks, nfpms stay the same ...

archives:
  - id: default
    builds:
      - agent
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE*   # optional; remove if no LICENSE file
      - README*

# Remove the entire windows-installer archive block (that's the duplicate source)

# ADD THIS at top-level (same level as builds/archives/nfpms/release)
extra_files:
  - glob: "Output_{{ .Arch }}/*.exe"
    name_template: "{{ .ProjectName }}_setup_{{ .Version }}_{{ .Arch }}.exe"  # unique name


release:
  github:
    owner: tekluabayneh
    name: Edge-Aware-Cybersecurity-Orchestrator
